<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Найди покой</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; color: #fff; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1080&q=80') no-repeat center center fixed; background-size: cover; min-height: 100vh; box-sizing: border-box; }
    .top-bar { position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 30px; }
    .ad-circle { width: 35px; height: 35px; background: #ff4b2b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
    .stone { width: 150px; height: 150px; cursor: pointer; user-select: none; margin: 20px auto; background-size: cover; border-radius: 50%; }
    button { padding: 12px 20px; margin: 5px; border: none; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; cursor: pointer; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; width: 80%; z-index: 10; }
    .distraction { position: absolute; background: rgba(255,255,255,0.9); color: black; padding: 10px; border-radius: 5px; font-size: 14px; pointer-events: none; }
    .bug { position: absolute; font-size: 30px; pointer-events: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="coin-counter">🪙 <span id="coins">0</span></div>
    <div class="ad-circle" onclick="showAdsgramAd()">ADS</div>
  </div>

  <div style="margin-top: 80px;">
    <h2>Найди покой</h2>
    <p>Нажми и удерживай камень</p>
    <div id="stone" class="stone" style="background-image: url('https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?w=300&auto=format&fit=crop');"></div>
    <p id="timer">00:00</p>
    <button onclick="document.getElementById('shop').style.display='block'">🪨 Магазин</button>
  </div>

  <div id="shop" class="modal">
    <h3>Магазин камней</h3>
    <p onclick="buyStone(0, 'https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?w=300')">1. Базовый (Выбран)</p>
    <p onclick="buyStone(1000, 'https://images.unsplash.com/photo-1611915387288-d8d2f624f83c?w=300')">2. Аметист (1000 🪙)</p>
    <p onclick="buyStone(2000, 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=300')">3. Рубин (2000 🪙)</p>
    <button onclick="document.getElementById('shop').style.display='none'">Закрыть</button>
  </div>

  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script>
    let coins = 0, timer = 0, interval, distInterval;
    const stone = document.getElementById('stone');
    
    stone.addEventListener('mousedown', start);
    stone.addEventListener('touchstart', start);
    stone.addEventListener('mouseup', stop);
    stone.addEventListener('touchend', stop);

    function start() {
      interval = setInterval(() => {
        timer++;
        document.getElementById('timer').innerText = new Date(timer * 1000).toISOString().substr(14, 5);
        if (timer % 60 === 0) { coins += 10; updateCoins(); }
      }, 1000);
      
      distInterval = setInterval(() => {
        if(Math.random() > 0.5) spawnDistraction();
        else spawnBug();
      }, 3000);
    }

    function stop() { clearInterval(interval); clearInterval(distInterval); }
    function updateCoins() { document.getElementById('coins').innerText = coins; }

    function buyStone(price, url) {
      if (coins >= price) { coins -= price; updateCoins(); stone.style.backgroundImage = `url('${url}')`; }
      else alert("Недостаточно монет!");
    }

    function spawnDistraction() {
      let d = document.createElement('div'); d.className = 'distraction';
      d.innerText = ["Вам СМС от Банка", "Курьер приехал", "Новое сообщение"][Math.floor(Math.random()*3)];
      d.style.top = Math.random()*80 + "%"; d.style.left = Math.random()*80 + "%";
      document.body.appendChild(d); setTimeout(() => d.remove(), 2000);
    }

    function spawnBug() {
      let b = document.createElement('div'); b.className = 'bug'; b.innerText = ["🕷️", "🪳"][Math.floor(Math.random()*2)];
      b.style.top = Math.random()*80 + "%"; b.style.left = Math.random()*80 + "%";
      document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
    }

    const AdController = window.Adsgram.init({ blockId: "61897" });
    function showAdsgramAd() {
      AdController.show().then(() => { coins += 50; updateCoins(); alert("+50 монет!"); }).catch(err => console.log(err));
    }
  </script>
</body>
</html>
