<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Найди покой</title>
  
  <!-- Скрипт Telegram (обязательно) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
    .stone { font-size: 60px; cursor: pointer; user-select: none; }
    .ad-block { border: 1px dashed #aaa; padding: 10px; margin: 20px auto; max-width: 300px; cursor: pointer; background: #fff; }
    button { padding: 10px 15px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>Найди покой</h2>
  <p>Остановись. Дыши. Почувствуй момент.</p>

  <div>
    <p>Нажми и удерживай камень</p>
    <div class="stone">🪨</div>
    <p>00:00</p>
  </div>

  <p>10 монет за каждую полную минуту</p>

  <div>
    <button>🪨 Магазин камней</button>
    <button>↻ Начать заново</button>
  </div>

  <!-- Рекламный блок -->
  <div class="ad-block" onclick="showAdsgramAd()">
    <strong>ADVERTISEMENT · ADSGRAM</strong><br>
    <span>Нажми, чтобы посмотреть рекламу и получить монеты</span>
  </div>

  <p>Сегодня: 0/30 минут · Прогресс сохраняется</p>

  <!-- Подключаем SDK Adsgram -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  
  <script>
    // Ваш ID уже вставлен
    const ADSGRAM_BLOCK_ID = "61897"; 

    // Инициализация
    const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

    // Функция показа рекламы
    function showAdsgramAd() {
      AdController.show().then((result) => {
        alert("Спасибо! Вы посмотрели рекламу.");
      }).catch((err) => {
        console.log("Реклама пропущена или ошибка:", err);
      });
    }
  </script>
</body>
</html>
