<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08070e">
  <title>Pulsora</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#08070e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;overflow:hidden}
    .app{min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 32px) 22px calc(env(safe-area-inset-bottom) + 24px);overflow:hidden}
    .glow{position:absolute;width:280px;height:280px;border-radius:50%;background:#6426ff;filter:blur(130px);opacity:.18;pointer-events:none}
    .glow.top{top:-160px;left:-150px}.glow.bottom{bottom:-180px;right:-140px}
    .top{width:100%;display:flex;align-items:center;justify-content:space-between;z-index:2}
    .score-pill{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:12px 20px;font-size:21px;font-weight:600}
    .star{font-size:25px}
    .ads-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
    .ads-button{width:78px;height:78px;border-radius:50%;background:#100d1c;border:2px solid #7946ff;color:white;font-size:20px;font-weight:700;box-shadow:0 0 18px rgba(120,60,255,.22);cursor:pointer;transition:transform .15s,opacity .2s}
    .ads-button:active{transform:scale(.94)}.ads-button:disabled{opacity:.5;cursor:default}
    .boost-label{background:linear-gradient(90deg,#783bff,#a43dff);border-radius:100px;padding:7px 15px;font-weight:800;font-size:15px;box-shadow:0 0 18px rgba(130,50,255,.4);white-space:nowrap}
    .counter{text-align:center;margin-top:45px;z-index:1}.number{font-size:clamp(72px,20vw,108px);font-weight:750;letter-spacing:-4px;line-height:1}.caption{margin-top:15px;color:#aaa1c7;font-size:24px}
    .tap-area{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;width:100%;z-index:1}
    .tap-ring{width:min(72vw,310px);height:min(72vw,310px);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle,rgba(125,65,255,.09) 0%,rgba(125,65,255,.02) 68%,transparent 70%);border:1px solid rgba(130,80,255,.12)}
    .tap-button{width:76%;height:76%;border:none;border-radius:50%;background:linear-gradient(145deg,#8b80ff,#762aff 90%);box-shadow:0 0 35px rgba(122,50,255,.35),inset 0 3px 15px rgba(255,255,255,.2);color:white;font-size:55px;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .08s ease;display:flex;align-items:center;justify-content:center}
    .tap-button:active,.tap-button.pressed{transform:scale(.93)}.tap-button span{pointer-events:none;font-weight:300}
    .float{position:fixed;color:#c3a5ff;font-size:24px;font-weight:700;pointer-events:none;animation:floatUp .65s ease-out forwards;z-index:10}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(1.25)}}
    .bottom{width:min(100%,340px);display:flex;justify-content:center;align-items:center;gap:12px;padding:17px 22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:100px;z-index:2;margin-top:10px;font-size:19px}
    .bolt{color:#b28aff;font-size:27px}.boost-timer{display:none;color:#b99aff;font-size:14px;margin-top:12px;z-index:2}.boost-timer.active{display:block}
    .toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%) translateY(10px);background:#211a35;border:1px solid #50318b;border-radius:15px;padding:12px 18px;font-size:14px;opacity:0;transition:.25s;z-index:20;text-align:center;width:max-content;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <main class="app">
    <div class="glow top"></div><div class="glow bottom"></div>
    <header class="top">
      <div class="score-pill"><span class="star">⭐</span><span id="score">0</span></div>
      <div class="ads-wrap"><button class="ads-button" id="adsButton">ADS</button><div class="boost-label">×2 TAP</div></div>
    </header>
    <section class="counter"><div class="number" id="tapCount">0</div><div class="caption">Тапов</div></section>
    <section class="tap-area"><div class="tap-ring"><button class="tap-button" id="tapButton" aria-label="Тап"><span>✦</span></button></div></section>
    <div class="bottom"><span class="bolt">ϟ</span><span id="tapReward">+1 за тап</span></div>
    <div class="boost-timer" id="boostTimer"></div><div class="toast" id="toast"></div>
  </main>
  <script>
    // ВСТАВЬ СВОЙ ADSGRAM BLOCK ID В КАВЫЧКИ НИЖЕ
    const ADSGRAM_BLOCK_ID = "61897";
    const BOOST_DURATION = 30; // x2 на 30 секунд
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const scoreEl=document.getElementById('score'), tapCountEl=document.getElementById('tapCount'), tapButton=document.getElementById('tapButton'), adsButton=document.getElementById('adsButton'), boostTimerEl=document.getElementById('boostTimer'), tapRewardEl=document.getElementById('tapReward'), toastEl=document.getElementById('toast');
    let score=Number(localStorage.getItem('starweek_score')||0), tapCount=Number(localStorage.getItem('starweek_taps')||0), boostUntil=Number(localStorage.getItem('starweek_boost')||0);
    function isBoostActive(){return Date.now()<boostUntil}
    function getTapReward(){return isBoostActive()?2:1}
    function saveGame(){localStorage.setItem('starweek_score',score);localStorage.setItem('starweek_taps',tapCount);localStorage.setItem('starweek_boost',boostUntil)}
    function updateUI(){scoreEl.textContent=score.toLocaleString();tapCountEl.textContent=tapCount.toLocaleString();if(isBoostActive()){const seconds=Math.ceil((boostUntil-Date.now())/1000);boostTimerEl.textContent=`×2 активно · ${seconds} сек`;boostTimerEl.classList.add('active');tapRewardEl.textContent='+2 за тап'}else{boostTimerEl.classList.remove('active');tapRewardEl.textContent='+1 за тап'}}
    function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2300)}
    function showFloat(event,amount){const el=document.createElement('div');el.className='float';el.textContent=`+${amount}`;let x=innerWidth/2,y=innerHeight/2;if(event&&event.clientX){x=event.clientX;y=event.clientY}el.style.left=`${x}px`;el.style.top=`${y}px`;document.body.appendChild(el);setTimeout(()=>el.remove(),700)}
    tapButton.addEventListener('click',event=>{const reward=getTapReward();score+=reward;tapCount++;saveGame();updateUI();showFloat(event,reward);tapButton.classList.add('pressed');setTimeout(()=>tapButton.classList.remove('pressed'),90);try{tg?.HapticFeedback?.impactOccurred('light')}catch(e){}});
    let AdController=null;
    function initAds(){if(!window.Adsgram)return;if(ADSGRAM_BLOCK_ID&&ADSGRAM_BLOCK_ID!=='YOUR_ADSGRAM_BLOCK_ID'){try{AdController=window.Adsgram.init({blockId:ADSGRAM_BLOCK_ID,debug:false})}catch(e){console.error('AdsGram init error',e)}}}
    initAds();
    adsButton.addEventListener('click',async()=>{if(!AdController){showToast('Сначала впиши Block ID AdsGram');return}adsButton.disabled=true;adsButton.textContent='...';try{const result=await AdController.show();if(result&&result.done===true){boostUntil=Date.now()+BOOST_DURATION*1000;saveGame();updateUI();showToast('×2 TAP активирован на 30 секунд!')}else{showToast('Реклама не завершена — бонус не начислен')}}catch(error){console.log('Ad error',error);showToast('Реклама недоступна. Попробуй позже.')}finally{adsButton.disabled=false;adsButton.textContent='ADS'}});
    setInterval(()=>{updateUI();if(boostUntil&&Date.now()>=boostUntil){boostUntil=0;saveGame();updateUI()}},500);updateUI();
  </script>
</body>
</html>
