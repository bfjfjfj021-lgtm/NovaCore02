  
<!DOCTYPE html>  
<html lang="ru">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">  
  <meta name="theme-color" content="#183c2b">  
  <title>Stone Meditation</title>  
  
  <!-- AdsGram SDK -->  
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>  
  
  <style>  
    * { box-sizing: border-box; }  
  
    :root {  
      --gold: #f4d18a;  
      --glass: rgba(15, 31, 23, .72);  
    }  
  
    body {  
      margin: 0;  
      min-height: 100vh;  
      min-height: 100dvh;  
      overflow: hidden;  
      color: #fff9e9;  
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;  
      background: #193b2b;  
      user-select: none;  
      -webkit-user-select: none;  
    }  
  
    button { font: inherit; cursor: pointer; }  
  
    .forest {  
      position: fixed;  
      inset: 0;  
      overflow: hidden;  
      background:  
        radial-gradient(ellipse at 50% 45%, rgba(186, 183, 117, .25), transparent 38%),  
        linear-gradient(180deg, #102d26 0%, #45664a 42%, #8b9160 72%, #34462d 100%);  
    }  
  
    .trees {  
      position: absolute;  
      inset: 0;  
      opacity: .8;  
      background:  
        conic-gradient(from 150deg at 10% 12%, transparent 0 25%, #102b21 26% 48%, transparent 49%) 0 0/130px 240px,  
        conic-gradient(from 150deg at 80% 10%, transparent 0 25%, #17372a 26% 48%, transparent 49%) 0 0/170px 280px;  
    }  
  
    .mist {  
      position: absolute;  
      inset: 28% -30% 0;  
      background: radial-gradient(ellipse, rgba(220, 218, 164, .22), transparent 65%);  
      filter: blur(20px);  
    }  
  
    .app {  
      position: relative;  
      z-index: 1;  
      display: flex;  
      flex-direction: column;  
      min-height: 100vh;  
      min-height: 100dvh;  
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));  
      gap: 12px;  
    }  
  
    .top {  
      display: flex;  
      align-items: flex-start;  
      justify-content: space-between;  
      gap: 10px;  
    }  
  
    .brand {  
      font-size: 19px;  
      font-weight: 850;  
      letter-spacing: 1px;  
      text-shadow: 0 2px 12px #14281a;  
    }  
  
    .subtitle {  
      font-size: 11px;  
      opacity: .78;  
      margin-top: 4px;  
    }  
  
    .ad-button {  
      border: 1px solid rgba(255,255,255,.55);  
      color: white;  
      background: rgba(13, 30, 22, .72);  
      border-radius: 50%;  
      width: 52px;  
      height: 52px;  
      font-size: 12px;  
      font-weight: 900;  
      box-shadow: 0 4px 18px #17291d55;  
    }  
  
    .stats {  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
      gap: 10px;  
    }  
  
    .pill {  
      background: var(--glass);  
      border: 1px solid #ffffff24;  
      border-radius: 15px;  
      padding: 10px 13px;  
      backdrop-filter: blur(10px);  
      font-size: 13px;  
    }  
  
    .pill strong { color: var(--gold); }  
  
    .scene {  
      position: relative;  
      flex: 1;  
      min-height: 230px;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      perspective: 700px;  
    }  
  
    .ground {  
      position: absolute;  
      width: 105%;  
      height: 35%;  
      bottom: 3%;  
      border-radius: 50%;  
      background: radial-gradient(ellipse, #1d2b1d 0%, #526044 40%, transparent 72%);  
      filter: blur(9px);  
    }  
  
    .stone-wrap {  
      position: relative;  
      z-index: 2;  
      width: min(72vw, 310px);  
      aspect-ratio: 1.15;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      transform: translateY(3%);  
    }  
  
    .stone {  
      position: relative;  
      width: 88%;  
      height: 74%;  
      border-radius: 46% 52% 39% 42% / 39% 40% 58% 58%;  
      background:  
        radial-gradient(ellipse at 30% 18%, #a9a69a 0%, #77796f 13%, transparent 30%),  
        radial-gradient(ellipse at 66% 30%, #5d625c 0%, transparent 35%),  
        linear-gradient(145deg, #73776e 0%, #454b47 35%, #282f2e 72%, #171f1d 100%);  
      box-shadow:  
        inset 9px 10px 18px #d6d3bc22,  
        inset -13px -17px 23px #090f0e88,  
        0 25px 22px #17241c88;  
      transform: rotateX(8deg) rotateZ(-5deg);  
      transition: transform .3s;  
    }  
  
    .stone::before {  
      content: "";  
      position: absolute;  
      inset: 8% 12%;  
      border-radius: inherit;  
      opacity: .5;  
      background:  
        repeating-linear-gradient(15deg, transparent 0 13px, #c0bfb01b 14px 15px, transparent 16px 27px),  
        radial-gradient(ellipse at 40% 25%, #ffffff15, transparent 45%);  
      filter: blur(1px);  
    }  
  
    .stone::after {  
      content: "";  
      position: absolute;  
      width: 22%;  
      height: 9%;  
      top: 21%;  
      left: 20%;  
      border-radius: 50%;  
      background: #d7d4c022;  
      filter: blur(6px);  
      transform: rotate(-24deg);  
    }  
  
    .stone-wrap.holding .stone {  
      transform: rotateX(12deg) rotateZ(-3deg) scale(1.025);  
    }  
  
    .bug {  
      position: absolute;  
      z-index: 4;  
      font-size: 25px;  
      filter: drop-shadow(0 3px 4px #0008);  
      animation: crawl 8s linear infinite alternate;  
      pointer-events: none;  
    }  
  
    .bug.b1 { top: 25%; left: 12%; }  
    .bug.b2 { top: 52%; right: 9%; animation-delay: -3s; }  
    .bug.b3 { bottom: 20%; left: 19%; animation-delay: -5s; }  
  
    @keyframes crawl {  
      0% { transform: translate(0,0) rotate(-8deg); }  
      50% { transform: translate(18px,-8px) rotate(12deg); }  
      100% { transform: translate(-8px,8px) rotate(-12deg); }  
    }  
  
    .timer-card {  
      text-align: center;  
      background: var(--glass);  
      border: 1px solid #ffffff22;  
      border-radius: 22px;  
      padding: 17px;  
      backdrop-filter: blur(12px);  
    }  
  
    .timer {  
      font-size: clamp(35px, 9vw, 49px);  
      font-weight: 800;  
      letter-spacing: 2px;  
      font-variant-numeric: tabular-nums;  
    }  
  
    .timer-label {  
      margin-top: 3px;  
      font-size: 12px;  
      opacity: .8;  
    }  
  
    .progress {  
      margin: 14px 0 7px;  
      height: 5px;  
      border-radius: 9px;  
      background: #ffffff25;  
      overflow: hidden;  
    }  
  
    .progress > div {  
      height: 100%;  
      width: 0%;  
      background: var(--gold);  
      transition: width .3s;  
    }  
  
    .hint {  
      font-size: 11px;  
      opacity: .72;  
    }  
  
    .hold-button {  
      width: 100%;  
      min-height: 59px;  
      border: 0;  
      border-radius: 18px;  
      background: linear-gradient(135deg, #f3d9a1, #d9b36b);  
      color: #273321;  
      font-weight: 900;  
      font-size: 16px;  
      box-shadow: 0 7px 22px #101a1555;  
      touch-action: none;  
    }  
  
    .hold-button:active { transform: scale(.99); }  
    .hold-button:disabled { opacity: .6; }  
  
    .notice {  
      position: fixed;  
      z-index: 20;  
      top: max(12px, env(safe-area-inset-top));  
      left: 12px;  
      right: 12px;  
      background: rgba(29, 38, 34, .96);  
      border: 1px solid #ffffff28;  
      border-radius: 17px;  
      padding: 14px 16px;  
      box-shadow: 0 8px 30px #0005;  
      transform: translateY(-150%);  
      transition: transform .35s ease;  
      pointer-events: none;  
    }  
  
    .notice.show { transform: translateY(0); }  
    .notice-title { font-weight: 800; margin-bottom: 4px; }  
    .notice-text { font-size: 13px; opacity: .9; }  
  
    .call-overlay {  
      position: fixed;  
      z-index: 30;  
      inset: 0;  
      background: rgba(9, 20, 15, .95);  
      display: none;  
      flex-direction: column;  
      align-items: center;  
      justify-content: center;  
      gap: 20px;  
      text-align: center;  
      padding: 25px;  
    }  
  
    .call-overlay.show { display: flex; }  
    .caller { font-size: 29px; font-weight: 800; }  
    .call-sub { opacity: .7; }  
  
    .answer {  
      margin-top: 25px;  
      width: 72px;  
      height: 72px;  
      border: none;  
      border-radius: 50%;  
      background: #db6259;  
      color: white;  
      font-size: 28px;  
    }  
  
    .call-small {  
      background: transparent;  
      color: #ffffffb0;  
      border: 1px solid #ffffff44;  
      border-radius: 14px;  
      padding: 10px 17px;  
    }  
  
    .bottom-note {  
      text-align: center;  
      font-size: 10px;  
      opacity: .6;  
    }  
  </style>  
</head>  
  
<body>  
  <div class="forest">  
    <div class="trees"></div>  
    <div class="mist"></div>  
  </div>  
  
  <main class="app">  
    <header class="top">  
      <div>  
        <div class="brand">STONE MEDITATION</div>  
        <div class="subtitle">Найди покой среди леса</div>  
      </div>  
      <button class="ad-button" id="adButton" aria-label="Посмотреть рекламу">  
        ADS  
      </button>  
    </header>  
  
    <section class="stats">  
      <div class="pill">🪙 Монеты: <strong id="coins">0</strong></div>  
      <div class="pill">🌿 Сегодня: <strong id="daily">0</strong>/30 мин</div>  
    </section>  
  
    <section class="scene" aria-label="Камень в лесу">  
      <div class="ground"></div>  
      <span class="bug b1">🕷️</span>  
      <span class="bug b2">🪰</span>  
      <span class="bug b3">🪱</span>  
      <div class="stone-wrap" id="stoneWrap">  
        <div class="stone"></div>  
      </div>  
    </section>  
  
    <section class="timer-card">  
      <div class="timer" id="timer">00:00</div>  
      <div class="timer-label">Время спокойствия</div>  
      <div class="progress"><div id="progressBar"></div></div>  
      <div class="hint" id="hint">Зажми кнопку, чтобы начать медитацию</div>  
    </section>  
  
    <button class="hold-button" id="holdButton">  
      УДЕРЖИВАЙ, ЧТОБЫ МЕДИТИРОВАТЬ  
    </button>  
  
    <div class="bottom-note">Остановись. Дыши. Почувствуй момент.</div>  
  </main>  
  
  <div class="notice" id="notice">  
    <div class="notice-title" id="noticeTitle">Уведомление</div>  
    <div class="notice-text" id="noticeText"></div>  
  </div>  
  
  <div class="call-overlay" id="callOverlay">  
    <div style="font-size:52px">📱</div>  
    <div class="caller">Входящий вызов</div>  
    <div class="call-sub">Неизвестный абонент</div>  
    <button class="answer" id="declineCall" aria-label="Отклонить вызов">✕</button>  
    <button class="call-small" id="ignoreCall">Продолжить медитацию</button>  
  </div>  
  
  <script>  
    // ==============================  
    // ADSGRAM  
    // ==============================  
    const ADSGRAM_BLOCK_ID = "62178";  
  
    let adController = null;  
  
    function initAdsGram() {  
      try {  
        if (!window.Adsgram) {  
          console.warn("AdsGram SDK пока не загружен");  
          return false;  
        }  
  
        adController = window.Adsgram.init({  
          blockId: ADSGRAM_BLOCK_ID  
        });  
  
        console.log("AdsGram инициализирован:", ADSGRAM_BLOCK_ID);  
        return true;  
      } catch (error) {  
        console.error("AdsGram init error:", error);  
        return false;  
      }  
    }  
  
    // ==============================  
    // СОСТОЯНИЕ И СОХРАНЕНИЕ  
    // ==============================  
    const $ = id => document.getElementById(id);  
  
    function getTodayKey() {  
      const now = new Date();  
      return [  
        now.getFullYear(),  
        String(now.getMonth() + 1).padStart(2, "0"),  
        String(now.getDate()).padStart(2, "0")  
      ].join("-");  
    }  
  
    function readNumber(key, fallback = 0) {  
      const value = Number(localStorage.getItem(key));  
      return Number.isFinite(value) && value >= 0 ? value : fallback;  
    }  
  
    let coins = readNumber("stoneCoins");  
    let totalSeconds = readNumber("stoneSeconds");  
    let dailySeconds = localStorage.getItem("stoneDay") === getTodayKey()  
      ? readNumber("stoneDailySeconds")  
      : 0;  
  
    let running = false;  
    let lastTick = 0;  
    let lastRewardMinute = Math.floor(totalSeconds / 60);  
    let lastNoticeTime = 0;  
    let noticeTimeout = null;  
    let callTimeout = null;  
  
    function save() {  
      localStorage.setItem("stoneCoins", String(coins));  
      localStorage.setItem("stoneSeconds", String(totalSeconds));  
      localStorage.setItem("stoneDay", getTodayKey());  
      localStorage.setItem("stoneDailySeconds", String(dailySeconds));  
    }  
  
    function formatTime(seconds) {  
      const mins = Math.floor(seconds / 60);  
      const secs = seconds % 60;  
      return String(mins).padStart(2, "0") + ":" +  
             String(secs).padStart(2, "0");  
    }  
  
    function render() {  
      $("coins").textContent = coins;  
      $("daily").textContent = Math.floor(dailySeconds / 60);  
      $("timer").textContent = formatTime(totalSeconds);  
      $("progressBar").style.width =  
        Math.min(100, (dailySeconds / 1800) * 100) + "%";  
    }  
  
    // ==============================  
    // МЕДИТАЦИЯ И НАГРАДЫ  
    // ==============================  
    function startMeditation() {  
      if (dailySeconds >= 1800) {  
        $("hint").textContent = "На сегодня лимит 30 минут исчерпан";  
        showNotice("Лимит достигнут", "Возвращайся завтра 🌲");  
        return;  
      }  
  
      if (running) return;  
  
      running = true;  
      lastTick = Date.now();  
      $("stoneWrap").classList.add("holding");  
      $("holdButton").textContent = "МЕДИТАЦИЯ ИДЁТ… ОТПУСТИ ДЛЯ ПАУЗЫ";  
      $("hint").textContent = "Оставайся в моменте";  
      requestAnimationFrame(tick);  
    }  
  
    function stopMeditation() {  
      running = false;  
      $("stoneWrap").classList.remove("holding");  
      $("holdButton").textContent = "УДЕРЖИВАЙ, ЧТОБЫ МЕДИТИРОВАТЬ";  
      $("hint").textContent = "Зажми кнопку, чтобы продолжить";  
      save();  
    }  
  
    function tick() {  
      if (!running) return;  
  
      const now = Date.now();  
      const elapsed = Math.max(0, Math.floor((now - lastTick) / 1000));  
  
      if (elapsed >= 1) {  
        lastTick += elapsed * 1000;  
  
        const allowed = Math.min(elapsed, 1800 - dailySeconds);  
  
        if (allowed > 0) {  
          const previousMinute = Math.floor(totalSeconds / 60);  
  
          totalSeconds += allowed;  
          dailySeconds += allowed;  
  
          const currentMinute = Math.floor(totalSeconds / 60);  
  
          if (currentMinute > previousMinute &&  
              currentMinute > lastRewardMinute) {  
            const earned = currentMinute - lastRewardMinute;  
            coins += earned;  
            lastRewardMinute = currentMinute;  
            showNotice("🪙 +" + earned + " монета", "Ещё одна минута спокойствия!");  
          }  
  
          render();  
          save();  
        }  
  
        if (dailySeconds >= 1800) {  
          stopMeditation();  
          $("hint").textContent = "Дневной лимит 30 минут достигнут";  
          showNotice("Медитация завершена", "Ты достиг дневной цели 🌿");  
          return;  
        }  
      }  
  
      requestAnimationFrame(tick);  
    }  
  
    const holdButton = $("holdButton");  
  
    holdButton.addEventListener("pointerdown", event => {  
      event.preventDefault();  
      startMeditation();  
    });  
  
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(name => {  
      holdButton.addEventListener(name, stopMeditation);  
    });  
  
    window.addEventListener("blur", stopMeditation);  
  
    // ==============================  
    // ADSGRAM: ПОКАЗ РЕКЛАМЫ  
    // ==============================  
    $("adButton").addEventListener("click", async () => {  
      if (!window.Adsgram) {  
        showNotice("AdsGram SDK не загрузился",  
          "Проверь интернет и подключение SDK.");  
        return;  
      }  
  
      if (!adController && !initAdsGram()) {  
        showNotice("Не удалось подключить рекламу",  
          "Проверь Block ID и настройки AdsGram.");  
        return;  
      }  
  
      const button = $("adButton");  
      button.disabled = true;  
      button.textContent = "...";  
  
      try {  
        const result = await adController.show();  
        console.log("AdsGram result:", result);  
  
        if (result && result.error) {  
          showNotice("Ошибка рекламы",  
            result.description || "Попробуй позже.");  
        } else {  
          showNotice("Реклама закрыта", "Спасибо за просмотр!");  
        }  
      } catch (error) {  
        console.error("AdsGram show error:", error);  
        showNotice("Реклама сейчас недоступна",  
          "Попробуй позже. Проверь консоль браузера.");  
      } finally {  
        button.disabled = false;  
        button.textContent = "ADS";  
      }  
    });  
  
    // ==============================  
    // УВЕДОМЛЕНИЯ  
    // ==============================  
    function showNotice(title, message) {  
      $("noticeTitle").textContent = title;  
      $("noticeText").textContent = message;  
      $("notice").classList.add("show");  
  
      clearTimeout(noticeTimeout);  
      noticeTimeout = setTimeout(() => {  
        $("notice").classList.remove("show");  
      }, 2600);  
    }  
  
    // Декоративные уведомления примерно раз в 3 секунды.  
    // Уведомления не начисляют награды и не открывают рекламу.  
    const fakeNotifications = [  
      ["🌲 Лес", "Ветер тихо шелестит в кронах деревьев."],  
      ["🪰 Маленький гость", "Муха пролетела рядом с камнем."],  
      ["🍃 Природа", "Лист упал на мягкую лесную землю."],  
      ["🕷️ Паучок", "Кажется, у камня появился сосед."]  
    ];  
  
    let notificationIndex = 0;  
  
    setInterval(() => {  
      if (document.hidden) return;  
      if (Date.now() - lastNoticeTime < 2900) return;  
      if ($("callOverlay").classList.contains("show")) return;  
  
      const item = fakeNotifications[  
        notificationIndex % fakeNotifications.length  
      ];  
      notificationIndex++;  
      lastNoticeTime = Date.now();  
  
      showNotice(item[0], item[1]);  
    }, 3000);  
  
    // Имитация входящего вызова.  
    // Это только визуальный эффект, не настоящий телефонный вызов.  
    function showFakeCall() {  
      if (document.hidden) return;  
      $("callOverlay").classList.add("show");  
      stopMeditation();  
    }  
  
    function closeFakeCall() {  
      $("callOverlay").classList.remove("show");  
    }  
  
    $("declineCall").addEventListener("click", closeFakeCall);  
    $("ignoreCall").addEventListener("click", closeFakeCall);  
  
    // Вызов появляется редко, чтобы не перекрывать игру постоянно.  
    function scheduleCall() {  
      clearTimeout(callTimeout);  
      callTimeout = setTimeout(() => {  
        showFakeCall();  
        scheduleCall();  
      }, 45000);  
    }  
  
    // ==============================  
    // ЗАПУСК  
    // ==============================  
    render();  
    initAdsGram();  
    scheduleCall();  
  </script>  
</body>  
</html>
